version: '3.8'

services:
  db:
    image: ankane/pgvector:v0.8.0
    container_name: kaamai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kaamai}
      POSTGRES_USER: ${POSTGRES_USER:-kaamai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kaamai_secret_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kaamai} -d ${POSTGRES_DB:-kaamai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: kaamai-ollama
    restart: unless-stopped
    volumes:
      - ollamadata:/root/.ollama
    ports:
      - "11434:11434"

  server:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: kaamai-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PYTHONUNBUFFERED: "1"
      PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost}
      DATABASE_URL: postgresql://${POSTGRES_USER:-kaamai}:${POSTGRES_PASSWORD:-kaamai_secret_password}@db:5432/${POSTGRES_DB:-kaamai}
      SESSION_SECRET: ${SESSION_SECRET:-change_this_to_a_secure_random_32_character_secret}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-embeddinggemma}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-2.5-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-text-embedding-004}
      VECTOR_BACKEND: pgvector
      UPLOAD_DIR: /app/data/uploads
      MAX_UPLOAD_MB: 15
      MAX_AGENT_STEPS: 5
    volumes:
      - uploadsdata:/app/data/uploads
    ports:
      - "4000:4000"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: kaamai-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  pgdata:
  ollamadata:
  uploadsdata:
